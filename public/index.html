<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganira - Sign Up / Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel { background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-black text-white h-screen flex items-center justify-center p-4">

    <div class="glass-panel p-8 rounded-3xl w-full max-w-sm space-y-6 shadow-2xl">
        <div class="text-center space-y-1">
            <h1 class="text-4xl font-extrabold tracking-wider bg-gradient-to-r from-purple-400 via-pink-500 to-yellow-500 bg-clip-text text-transparent">Ganira</h1>
            <p id="form-subtitle" class="text-xs text-neutral-400 font-medium tracking-wide uppercase">Create a new account</p>
        </div>
        
        <div id="error-msg" class="bg-red-500/10 border border-red-500/30 text-red-400 text-xs p-3 rounded-xl text-center hidden"></div>

        <!-- AUTH FORM -->
        <form id="auth-form" class="space-y-3.5">
            <!-- Full Name / Username -->
            <div>
                <input type="text" id="username" placeholder="Full name or username" class="w-full bg-neutral-900/90 border border-neutral-800 p-3.5 rounded-xl text-white placeholder-neutral-500 focus:outline-none focus:border-purple-500 text-xs font-medium" required>
            </div>
            
            <!-- Email -->
            <div>
                <input type="email" id="email" placeholder="Email address" class="w-full bg-neutral-900/90 border border-neutral-800 p-3.5 rounded-xl text-white placeholder-neutral-500 focus:outline-none focus:border-purple-500 text-xs font-medium" required>
            </div>

            <!-- Date of Birth (Must be 18+) -->
            <div id="dob-field" class="space-y-1">
                <label class="block text-[10px] text-neutral-400 font-bold uppercase tracking-wider">Date of Birth (Must be 18+)</label>
                <input type="date" id="dob" class="w-full bg-neutral-900/90 border border-neutral-800 p-3 rounded-xl text-white focus:outline-none focus:border-purple-500 text-xs font-medium" required>
            </div>

            <!-- Password -->
            <div>
                <input type="password" id="password" placeholder="Create Password" class="w-full bg-neutral-900/90 border border-neutral-800 p-3.5 rounded-xl text-white placeholder-neutral-500 focus:outline-none focus:border-purple-500 text-xs font-medium" required>
            </div>

            <!-- Upload Picture Button -->
            <div class="pt-1">
                <label class="flex items-center justify-center w-full border-2 border-dashed border-neutral-700 bg-neutral-900/50 hover:bg-neutral-900 py-3 rounded-xl cursor-pointer transition text-xs font-bold text-purple-400">
                    <span>+ UPLOAD PICTURE</span>
                    <input type="file" id="profile-pic" accept="image/*" class="hidden">
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="auth-btn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white p-3.5 rounded-xl font-bold hover:opacity-95 transition text-xs tracking-wider uppercase shadow-lg shadow-purple-900/30">Sign Up</button>
        </form>

        <!-- Switch between Login and Register -->
        <div class="text-center text-xs text-neutral-400 border-t border-neutral-800/80 pt-4">
            <span id="switch-text">Already have an account?</span> 
            <button onclick="toggleMode()" id="switch-btn" class="text-purple-400 font-bold hover:underline ml-1">Log In</button>
        </div>
    </div>

    <script>
        let isSignup = true;

        function toggleMode() {
            isSignup = !isSignup;
            const title = document.getElementById('form-subtitle');
            const btn = document.getElementById('auth-btn');
            const switchText = document.getElementById('switch-text');
            const switchBtn = document.getElementById('switch-btn');
            const dobField = document.getElementById('dob-field');
            const userField = document.getElementById('username');

            if (isSignup) {
                title.innerText = "Create a new account";
                btn.innerText = "Sign Up";
                switchText.innerText = "Already have an account?";
                switchBtn.innerText = "Log In";
                dobField.style.display = "block";
                userField.placeholder = "Full name or username";
            } else {
                title.innerText = "Log in to your account";
                btn.innerText = "Log In";
                switchText.innerText = "Don't have an account?";
                switchBtn.innerText = "Sign Up";
                dobField.style.display = "none";
                userField.placeholder = "Email address";
            }
            document.getElementById('error-msg').classList.add('hidden');
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const dob = document.getElementById('dob').value;
            
            const endpoint = isSignup ? '/api/signup' : '/api/login';
            const payload = isSignup ? { username, email, password, dob } : { email: username, password };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('ganira_user', isSignup ? email : username);
                    window.location.href = '/home.html';
                } else {
                    const errDiv = document.getElementById('error-msg');
                    errDiv.innerText = data.error || "Habaye ikibazo";
                    errDiv.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
