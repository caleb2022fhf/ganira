<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <title>Ganira - AI Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen pb-16">
    <header class="sticky top-0 bg-black border-b border-neutral-800 p-4 text-center max-w-md mx-auto">
        <h1 class="text-lg font-bold text-cyan-400">🤖 Ganira AI Assistant</h1>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <div id="ai-chat" class="h-96 overflow-y-auto border border-neutral-800 p-3 rounded-xl space-y-2 text-xs">
            <div class="bg-neutral-900 p-2 rounded-lg text-purple-300"><strong>AI:</strong> Muraho! Ntegereye ikibazo cyawe.</div>
        </div>
        <form id="ai-form" class="flex gap-2">
            <input type="text" id="ai-input" placeholder="Baza AI..." class="flex-1 bg-black border border-neutral-800 p-2.5 rounded-xl text-xs text-white" required>
            <button type="submit" class="bg-cyan-600 text-white px-4 py-2 rounded-xl text-xs font-bold">Baza</button>
        </form>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-black border-t border-neutral-800 p-3 flex justify-around max-w-md mx-auto">
        <a href="/home.html" class="text-neutral-500 text-xs font-bold">🏠 Home</a>
        <a href="/ai.html" class="text-purple-400 text-xs font-bold">🤖 AI Mode</a>
        <a href="/chat.html" class="text-neutral-500 text-xs font-bold">💬 Chat</a>
    </nav>

    <script>
        document.getElementById('ai-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = document.getElementById('ai-input').value;
            const box = document.getElementById('ai-chat');
            box.innerHTML += `<div class="bg-neutral-800 p-2 rounded-lg">You: ${prompt}</div>`;
            document.getElementById('ai-input').value = '';

            const res = await fetch('/api/ai', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt })
            });
            const data = await res.json();
            box.innerHTML += `<div class="bg-neutral-900 p-2 rounded-lg text-purple-300">AI: ${data.reply}</div>`;
            box.scrollTop = box.scrollHeight;
        });
    </script>
</body>
</html>
