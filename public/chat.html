<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <title>Ganira - Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen pb-16">
    <header class="sticky top-0 bg-black border-b border-neutral-800 p-4 text-center max-w-md mx-auto">
        <h1 class="text-lg font-bold text-purple-400">💬 Direct Messages</h1>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <div id="messages" class="h-96 overflow-y-auto border border-neutral-800 p-3 rounded-xl space-y-2 text-xs"></div>
        <form id="chat-form" class="flex gap-2">
            <input type="text" id="msg-input" placeholder="Andika ubutumwa..." class="flex-1 bg-black border border-neutral-800 p-2.5 rounded-xl text-xs text-white" required>
            <button type="submit" class="bg-purple-600 text-white px-4 py-2 rounded-xl text-xs font-bold">Ohereza</button>
        </form>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-black border-t border-neutral-800 p-3 flex justify-around max-w-md mx-auto">
        <a href="/home.html" class="text-neutral-500 text-xs font-bold">🏠 Home</a>
        <a href="/ai.html" class="text-neutral-500 text-xs font-bold">🤖 AI Mode</a>
        <a href="/chat.html" class="text-purple-400 text-xs font-bold">💬 Chat</a>
    </nav>

    <script>
        const user = localStorage.getItem('ganira_user');
        async function loadMessages() {
            const res = await fetch('/api/messages');
            const msgs = await res.json();
            document.getElementById('messages').innerHTML = msgs.map(m => `
                <div class="bg-neutral-900 p-2 rounded-lg"><span class="text-purple-400 font-bold">${m.sender}:</span> ${m.message}</div>
            `).join('');
        }
        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = document.getElementById('msg-input').value;
            await fetch('/api/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sender: user, message })
            });
            document.getElementById('msg-input').value = '';
            loadMessages();
        });
        loadMessages();
        setInterval(loadMessages, 3000);
    </script>
</body>
</html>
